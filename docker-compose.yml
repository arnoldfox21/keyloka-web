services:
  web:
    image: ${DOCKER_IMAGE:-keyloka-web:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keyloka-web
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
