name: Deploy DEV to Cloudflare

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (OpenNext)
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SITE_URL: https://dev.keyloka.com
          NEXT_PUBLIC_API_URL: https://api-dev.keyloka.com/api
          NEXT_PUBLIC_MIDTRANS_IS_PRODUCTION: "false"
          NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${{ secrets.DEV_MIDTRANS_CLIENT_KEY }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.DEV_GOOGLE_CLIENT_ID }}
      - name: Deploy to Worker keyloka-web-dev
        run: npx opennextjs-cloudflare deploy -- --env dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
